name: win12-desktop
title: Win12 Desktop
summary: Windows 12-like desktop environment for Linux
description: |
  Win12 Desktop is a Windows 12-like desktop environment implemented
  with Tauri for Linux.

version: "0.3.3"
website: https://github.com/win12-online/win12-desktop
source-code: https://github.com/win12-online/win12-desktop
issues: https://github.com/win12-online/win12-desktop/issues
license: EPL-2.0

base: core24
confinement: strict
grade: devel

platforms:
  amd64:

parts:
  rust-deps:
    plugin: nil
    build-packages:
      - curl
      - ca-certificates

    override-build: |
      set -eux

      mkdir -p "$CRAFT_PART_INSTALL/opt/rustup"
      mkdir -p "$CRAFT_PART_INSTALL/opt/cargo"

      export RUSTUP_HOME="$CRAFT_PART_INSTALL/opt/rustup"
      export CARGO_HOME="$CRAFT_PART_INSTALL/opt/cargo"

      curl --proto '=https' --tlsv1.2 -sSf \
        https://sh.rustup.rs \
        -o rustup-init.sh

      sh rustup-init.sh \
        -y \
        --no-modify-path \
        --profile minimal \
        --default-toolchain stable

  win12-desktop:
    plugin: nil
    source: .

    after:
      - rust-deps

    build-environment:
      - RUSTUP_HOME: $CRAFT_STAGE/opt/rustup
      - CARGO_HOME: $CRAFT_STAGE/opt/cargo
      - PATH: $CRAFT_STAGE/opt/cargo/bin:$PATH

    build-packages:
      - build-essential
      - pkg-config
      - libwebkit2gtk-4.1-dev
      - libgtk-3-dev
      - libayatana-appindicator3-dev
      - librsvg2-dev
      - libxdo-dev
      - patchelf

    stage-packages:
      - iputils-ping
      - libayatana-appindicator3-1
      - librsvg2-2
      - libxdo3

    # The GNOME extension supplies a mutually compatible GTK/WebKit runtime.
    # Exclude these transitive copies so its WebKitWebProcess cannot load this
    # snap's newer WebKit/JSC libraries through LD_LIBRARY_PATH.
    stage:
      - -usr/lib/x86_64-linux-gnu/libwebkit2gtk-4.1.so*
      - -usr/lib/x86_64-linux-gnu/libjavascriptcoregtk-4.1.so*
      - -usr/lib/x86_64-linux-gnu/webkit2gtk-4.1/**
      - -usr/lib/x86_64-linux-gnu/libgtk-3.so*
      - -usr/lib/x86_64-linux-gnu/libgdk-3.so*

    override-build: |
      set -eux

      craftctl default

      export RUSTUP_HOME="$CRAFT_STAGE/opt/rustup"
      export CARGO_HOME="$CRAFT_STAGE/opt/cargo"
      export PATH="$CRAFT_STAGE/opt/cargo/bin:$PATH"

      cargo --version
      rustc --version

      cargo build \
        --release \
        --locked \
        --manifest-path tauri/src-tauri/Cargo.toml

      install -Dm755 \
        tauri/src-tauri/target/release/win12-desktop \
        "$CRAFT_PART_INSTALL/usr/bin/win12-desktop"

      install -Dm644 \
        io.github.win12_online.win12_desktop.desktop \
        "$CRAFT_PART_INSTALL/usr/share/applications/io.github.win12_online.win12_desktop.desktop"

      install -Dm644 \
        io.github.win12_online.win12_desktop.metainfo.xml \
        "$CRAFT_PART_INSTALL/usr/share/metainfo/io.github.win12_online.win12_desktop.metainfo.xml"

      install -Dm644 \
        tauri/src-tauri/icons/128x128.png \
        "$CRAFT_PART_INSTALL/usr/share/icons/hicolor/128x128/apps/io.github.win12_online.win12_desktop.png"

      install -Dm644 \
        tauri/src-tauri/icons/128x128@2x.png \
        "$CRAFT_PART_INSTALL/usr/share/icons/hicolor/256x256/apps/io.github.win12_online.win12_desktop.png"

apps:
  win12-desktop:
    command: usr/bin/win12-desktop
    extensions:
      - gnome
    plugs:
      - desktop
      - desktop-legacy
      - home
      - network
      - opengl
      - audio-playback
      - pulseaudio
      - wayland
      - x11
