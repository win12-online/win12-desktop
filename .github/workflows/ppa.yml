name: Publish to Ubuntu PPA

# Builds a Debian source package from a published GitHub Release and uploads
# it to ppa:win12-online/win12-desktop for Ubuntu 26.04 (resolute).
#
# The orig tarball is produced by scripts/export-orig-tarball.sh, which
# expands the nested Git submodules (tauri/src and tauri/src/lang) instead of
# using a plain `git archive HEAD`. The Debian source tree is then assembled
# by extracting that pristine orig tarball and overlaying ONLY the tracked
# debian/ directory, so dpkg-source never sees unexpected upstream changes.

on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag，可带 v 前缀，例如 v0.3.0 或 0.3.0'
        required: true
        type: string
      confirm_upload:
        description: '勾选才会真正签名并上传到 PPA；不勾选则只构建并产出 artifact（演练）'
        required: true
        type: boolean
        default: false

permissions:
  contents: read

# Never run two uploads for the same ref at once; let the first finish.
concurrency:
  group: ppa-${{ github.ref }}
  cancel-in-progress: false

env:
  PKG: win12-desktop
  DIST: resolute
  UBUNTU_RELEASE: '26.04'
  PPA: ppa:win12-online/win12-desktop

jobs:
  publish:
    name: Build source package and upload to PPA
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      # Sibling of the checkout, so the Debian build never pollutes the Git
      # work tree / orig tarball. The github context is usable in job-level
      # env (the runner context is not).
      BUILD_DIR: ${{ github.workspace }}/../ppa-build
      GPG_HOME: ${{ github.workspace }}/../ppa-gnupg
      GNUPGHOME: ${{ github.workspace }}/../ppa-gnupg
      # Populated by the "Resolve and validate release version" step; declared
      # here as defaults so step conditions/expressions always type-check.
      RELEASE_TAG: ''
      UPSTREAM_VERSION: ''
      DEBIAN_VERSION: ''
      UPLOAD: '0'

    steps:
      - name: Resolve and validate release version
        id: ver
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TAG_NAME: ${{ github.event.release.tag_name }}
          RELEASE_PRERELEASE: ${{ github.event.release.prerelease }}
          INPUT_TAG: ${{ inputs.tag }}
          CONFIRM_UPLOAD: ${{ inputs.confirm_upload }}
        run: |
          set -euo pipefail

          tag=""
          prerelease="false"
          if [[ "$EVENT_NAME" == "release" ]]; then
            tag="$RELEASE_TAG_NAME"
            prerelease="${RELEASE_PRERELEASE:-false}"
          else
            tag="$INPUT_TAG"
          fi

          if [[ -z "$tag" ]]; then
            echo "::error::无法确定 Release tag（release 事件或手动输入均为空）"
            exit 1
          fi

          # Pre-releases never go to the stable PPA.
          if [[ "$prerelease" == "true" ]]; then
            echo "::error::该 Release 被标记为 pre-release，拒绝上传到 PPA: $tag"
            exit 1
          fi

          # Strip exactly one leading 'v': v0.3.0 -> 0.3.0 (0.3.0 stays).
          upstream="${tag#v}"
          if [[ ! "$upstream" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::tag '$tag' 去掉可选的 v 前缀后不是合法的 X.Y.Z 上游版本: '$upstream'"
            exit 1
          fi

          upload=0
          if [[ "$EVENT_NAME" == "release" ]]; then
            upload=1
          elif [[ "${CONFIRM_UPLOAD:-false}" == "true" ]]; then
            upload=1
          fi

          {
            echo "RELEASE_TAG=$tag"
            echo "UPSTREAM_VERSION=$upstream"
            echo "UPLOAD=$upload"
          } >> "$GITHUB_ENV"

          echo "::group::版本摘要（不含任何密钥）"
          echo "event          : $EVENT_NAME"
          echo "release tag    : $tag"
          echo "upstream ver   : $upstream"
          echo "debian version : 由 debian/changelog 在后续步骤确定"
          echo "distribution   : $DIST"
          echo "PPA            : $PPA"
          echo "will upload    : $upload (1=真实上传, 0=仅构建演练)"
          echo "::endgroup::"

      - name: Fail fast when signing secrets are missing
        if: env.UPLOAD == '1'
        shell: bash
        env:
          PPA_GPG_PRIVATE_KEY: ${{ secrets.PPA_GPG_PRIVATE_KEY }}
          PPA_GPG_PASSPHRASE: ${{ secrets.PPA_GPG_PASSPHRASE }}
          PPA_GPG_KEY_ID: ${{ secrets.PPA_GPG_KEY_ID }}
        run: |
          set -euo pipefail
          missing=0
          for var in PPA_GPG_PRIVATE_KEY PPA_GPG_PASSPHRASE PPA_GPG_KEY_ID; do
            if [[ -z "${!var:-}" ]]; then
              echo "::error::缺少必需的 Secret: $var"
              missing=1
            fi
          done
          if [[ "$PPA_GPG_KEY_ID" != "F280B508B651B154E207327107B4C06652A89FE1" ]]; then
            echo "::error::PPA_GPG_KEY_ID 与预期的 PPA 专用密钥指纹不一致（已隐藏具体值）"
            missing=1
          fi
          [[ "$missing" -eq 0 ]] || exit 1
          echo "所有签名 Secret 均已提供。"

      - name: Checkout (with nested submodules)
        uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0
          fetch-tags: true
          lfs: true

      # For release events, checkout already uses the tag ref, so HEAD and
      # tag are aligned by definition. For workflow_dispatch the user picks a
      # branch (checked out as HEAD) and types a tag (used for the version
      # number); those can diverge. Verify the tag's commit is an ancestor of
      # (or equal to) HEAD so the branch is guaranteed to contain everything
      # the tag points at — the package is then built from the branch HEAD
      # code, not from the tag's older commit.
      - name: Verify HEAD alignment with tag (workflow_dispatch only)
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          RELEASE_TAG: ${{ env.RELEASE_TAG }}
        run: |
          set -euo pipefail
          tag_sha="$(git rev-parse "refs/tags/${RELEASE_TAG}^{commit}" 2>/dev/null || true)"
          if [[ -z "$tag_sha" ]]; then
            git fetch origin "refs/tags/${RELEASE_TAG}:refs/tags/${RELEASE_TAG}"
            tag_sha="$(git rev-parse "refs/tags/${RELEASE_TAG}^{commit}")"
          fi
          head_sha="$(git rev-parse HEAD)"
          echo "tag  commit: $tag_sha"
          echo "HEAD commit: $head_sha"
          if [[ "$tag_sha" == "$head_sha" ]]; then
            echo "HEAD 等于 tag 的 commit — 完全对齐。"
            exit 0
          fi
          if git merge-base --is-ancestor "$tag_sha" "$head_sha"; then
            echo "HEAD 在 tag 之后 — 分支包含 tag 的全部代码加上新增提交。"
            echo "包将从分支 HEAD 代码构建，版本号来自 tag。"
          else
            echo "::error::HEAD ($head_sha) 不包含 tag '$RELEASE_TAG' ($tag_sha) 的提交。"
            echo "选中的分支与该 tag 无继承关系；请选择包含此 tag 的分支。"
            exit 1
          fi


      - name: Install packaging toolchain
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update

          sudo apt-get install -y --no-install-recommends \
            ca-certificates tar xz-utils gzip bzip2 \
            build-essential debhelper devscripts dpkg-dev fakeroot lintian dput \
            cargo rustc pkgconf python3 git git-lfs gnupg gpg-agent \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev

          git lfs version || true

          echo "=== GPG tools ==="
          gpg --version
          gpg-agent --version

          echo "=== Locate gpg-preset-passphrase ==="
          find /usr -type f -name gpg-preset-passphrase 2>/dev/null || true

          dpkg-query -W -f='dput ${Version}\n' dput
          dpkg-buildpackage --version | head -1

      - name: Install a recent Rust toolchain
        # The distro cargo (kept installed so dpkg Build-Depends are
        # satisfied) is too old on the GitHub runner to read the v4
        # Cargo.lock used by this project. Put a modern toolchain first on
        # PATH for `cargo vendor` and the offline build check; Launchpad
        # itself builds with resolute's distro cargo, which is current.
        uses: dtolnay/rust-toolchain@stable

      - name: Cross-check version consistency
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, re, sys

          expected = os.environ["UPSTREAM_VERSION"]
          root = os.environ["GITHUB_WORKSPACE"]
          errors = []

          def read(rel):
              with open(os.path.join(root, rel), encoding="utf-8") as fh:
                  return fh.read()

          # package.json
          if json.loads(read("package.json"))["version"] != expected:
              errors.append("package.json version mismatch")

          # tauri.conf.json
          if json.loads(read("tauri/src-tauri/tauri.conf.json"))["version"] != expected:
              errors.append("tauri/src-tauri/tauri.conf.json version mismatch")

          # Cargo.toml: only the version inside the [package] table.
          cargo = read("tauri/src-tauri/Cargo.toml")
          m = re.search(r"^\[package\](?P<body>.*?)(?=^\[)", cargo, re.S | re.M)
          cv = re.search(r'^version\s*=\s*"([^"]+)"', m.group("body"), re.M) if m else None
          if not cv or cv.group(1) != expected:
              errors.append(f"Cargo.toml [package] version mismatch (got {cv.group(1) if cv else '?'})")

          # Cargo.lock: the win12-desktop package entry.
          lock = read("tauri/src-tauri/Cargo.lock")
          lv = None
          for block in lock.split("[[package]]"):
              if re.search(r'^name = "win12-desktop"', block, re.M):
                  mm = re.search(r'^version = "([^"]+)"', block, re.M)
                  lv = mm.group(1) if mm else None
          if lv != expected:
              errors.append(f"Cargo.lock win12-desktop version mismatch (got {lv})")

          if errors:
              for e in errors:
                  print(f"::error::{e}; tag expects {expected}")
              print("请先运行 scripts/bump-version.sh 并在该提交上重新打 Release tag。")
              sys.exit(1)
          print(f"所有版本字段一致: {expected}")
          PY

      - name: Build pristine upstream orig tarball (submodules expanded)
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$BUILD_DIR"
          mkdir -p "$BUILD_DIR"
          chmod +x scripts/export-orig-tarball.sh
          scripts/export-orig-tarball.sh "$UPSTREAM_VERSION" "$BUILD_DIR"

      - name: Verify orig tarball contents
        shell: bash
        run: |
          set -euo pipefail
          tarball="$BUILD_DIR/${PKG}_${UPSTREAM_VERSION}.orig.tar.gz"
          prefix="${PKG}-${UPSTREAM_VERSION}"
          tar -tzf "$tarball" > "$BUILD_DIR/orig.listing"
          echo "::group::orig tarball canary files"
          for rel in \
            "tauri/src/apps/icons/explorer/disk.png" \
            "tauri/src/icon/bilibili.png" \
            "tauri/src/media/Windows Background.wav" \
            "tauri/src/lang/README.md" \
            "tauri/src/lang/lang/lang_en.properties"
          do
            grep -Fxq "$prefix/$rel" "$BUILD_DIR/orig.listing"
            echo "OK  $rel"
          done
          echo "::endgroup::"
          if grep -E "(^|/)\.git($|/)" "$BUILD_DIR/orig.listing"; then
            echo "::error::orig tarball 中出现了 .git 元数据"; exit 1
          fi
          if grep -E "^${prefix}/debian(/|$)" "$BUILD_DIR/orig.listing"; then
            echo "::error::orig tarball 中不允许包含 debian/ 目录"; exit 1
          fi
          echo "entries: $(wc -l < "$BUILD_DIR/orig.listing")"

      - name: Assemble Debian source tree (orig + tracked debian/)
        shell: bash
        run: |
          set -euo pipefail
          src="$BUILD_DIR/${PKG}-${UPSTREAM_VERSION}"
          tar -xzf "$BUILD_DIR/${PKG}_${UPSTREAM_VERSION}.orig.tar.gz" -C "$BUILD_DIR"
          # Overlay ONLY debian/ files tracked by Git (no local build cruft).
          git archive HEAD -- debian | tar -x -C "$src"
          # debian/changelog is hand-maintained: never rewrite it here. Only
          # verify that the first (manual) entry already matches the release.
          srcpkg="$(dpkg-parsechangelog -l "$src/debian/changelog" -S Source)"
          v="$(dpkg-parsechangelog -l "$src/debian/changelog" -S Version)"
          d="$(dpkg-parsechangelog -l "$src/debian/changelog" -S Distribution)"
          [[ "$srcpkg" == "$PKG" ]] || { echo "::error::changelog Source '$srcpkg' != '$PKG'"; exit 1; }
          # The Debian revision number (the N in -N~ubuntu26.04.1) is
          # hand-maintained in debian/changelog and may be bumped for
          # re-packaging without a new upstream release (e.g. -1, -2, -3).
          # Validate the upstream version and Ubuntu suffix, but accept any
          # positive integer revision.
          cl_upstream="${v%%-*}"
          cl_revision="${v#*-}"
          [[ "$cl_upstream" == "$UPSTREAM_VERSION" ]] || {
            echo "::error::changelog 上游版本 '$cl_upstream' != '$UPSTREAM_VERSION'。"
            echo "::error::debian/changelog 为人工维护文件，CI 不会自动修改；请先手工添加该版本条目。"
            exit 1
          }
          [[ "$cl_revision" =~ ^[0-9]+~ubuntu${UBUNTU_RELEASE//./\\.}(\.[0-9]+)?$ ]] || {
            echo "::error::changelog 版本 '$v' 的 Debian revision '$cl_revision' 不符合格式 'N~ubuntu${UBUNTU_RELEASE}[.M]'。"
            exit 1
          }
          # Override DEBIAN_VERSION with the actual changelog version so all
          # downstream steps (debuild, lintian, upload) reference the correct
          # revision and file names.
          echo "DEBIAN_VERSION=$v" >> "$GITHUB_ENV"
          [[ "$d" == "$DIST" ]] || {
            echo "::error::debian/changelog 首条发行版为 '$d'，期望 '$DIST'；请手工修正后重新发布。"
            exit 1
          }
          echo "changelog (manual): $srcpkg / $v / $d"

      - name: Validate full offline build (Launchpad parity)
        # debuild -S does not compile, so vendoring errors would otherwise
        # only appear on Launchpad. Run the exact build sequence here with a
        # pristine CARGO_HOME and network forcibly disabled. The following
        # debuild -S runs `clean`, which removes the produced target tree.
        shell: bash
        run: |
          set -euo pipefail
          src="$BUILD_DIR/${PKG}-${UPSTREAM_VERSION}"
          cd "$src"
          CARGO_NET_OFFLINE=true fakeroot make -f debian/rules build
          test -x "tauri/src-tauri/target/release/${PKG}"
          echo "offline build OK; Launchpad will reuse this same vendor/ tree."

      - name: Build unsigned source package (debuild -S -sa)
        shell: bash
        run: |
          set -euo pipefail
          src="$BUILD_DIR/${PKG}-${UPSTREAM_VERSION}"
          cd "$src"

          # -us -uc: do not sign here; debsign signs with the PPA key later.
          # -sa: include the orig tarball (required for new upstream uploads).
          debuild -S -sa -us -uc

      - name: Run lintian (report only)
        shell: bash
        run: |
          set -euo pipefail

          cd "$BUILD_DIR"
          changes="${PKG}_${DEBIAN_VERSION}_source.changes"

          [[ -f "$changes" ]] || {
            echo "::error::找不到 .changes 文件: $changes"
            exit 1
          }

          lintian \
            -i \
            -I \
            --show-overrides \
            "$changes" \
            2>&1 | tee "$BUILD_DIR/lintian.log" || true

          if grep -qE '^E:' "$BUILD_DIR/lintian.log"; then
            echo "::warning::lintian reported error-level tags; see lintian.log"
            grep -E '^E:' "$BUILD_DIR/lintian.log" || true
          else
            echo "lintian: 没有 E: 级别问题。"
          fi

          echo "Lintian 仅用于报告，不阻止 PPA 构建。"

      - name: Import PPA GPG key into an ephemeral keyring
        if: env.UPLOAD == '1'
        shell: bash
        env:
          GNUPGHOME: ${{ env.GPG_HOME }}
          PPA_GPG_PRIVATE_KEY: ${{ secrets.PPA_GPG_PRIVATE_KEY }}
          PPA_GPG_PASSPHRASE: ${{ secrets.PPA_GPG_PASSPHRASE }}
          PPA_GPG_KEY_ID: ${{ secrets.PPA_GPG_KEY_ID }}
        run: |
          set -euo pipefail

          install -d -m 700 "$GNUPGHOME"

          cat > "$GNUPGHOME/gpg-agent.conf" <<'EOF'
          allow-loopback-pinentry
          allow-preset-passphrase
          default-cache-ttl 86400
          max-cache-ttl 86400
          EOF

          cat > "$GNUPGHOME/gpg.conf" <<'EOF'
          use-agent
          pinentry-mode loopback
          EOF

          chmod 600 "$GNUPGHOME"/*.conf
          gpgconf --kill gpg-agent || true

          printf '%s' "$PPA_GPG_PRIVATE_KEY" |
            gpg --batch --no-tty --import

          echo "::group::Imported secret keys"
          gpg --batch --list-secret-keys --keyid-format LONG
          echo "::endgroup::"

          fpr="$(
            gpg --batch --list-secret-keys --with-colons |
              awk -F: '/^fpr:/{print $10; exit}'
          )"

          [[ -n "$fpr" ]] || {
            echo "::error::导入后没有找到 secret key"
            exit 1
          }

          if [[ "${fpr^^}" != "${PPA_GPG_KEY_ID^^}" ]]; then
            echo "::error::导入的密钥指纹与 PPA_GPG_KEY_ID 不一致"
            exit 1
          fi


      - name: Sign dsc/buildinfo/changes with debsign
        if: env.UPLOAD == '1'
        shell: bash
        env:
          GNUPGHOME: ${{ env.GPG_HOME }}
          PPA_GPG_KEY_ID: ${{ secrets.PPA_GPG_KEY_ID }}
          PPA_GPG_PASSPHRASE: ${{ secrets.PPA_GPG_PASSPHRASE }}
          DEBEMAIL: oliver@liuxiaozhen.dev
          DEBFULLNAME: Oliver Lin
        run: |

          # Restart the agent using the current GNUPGHOME.
          gpgconf --kill gpg-agent || true
          gpg-connect-agent /bye

          # gpg-preset-passphrase requires the keygrip, not the fingerprint.
          keygrip="$(
            gpg --batch --with-keygrip --list-secret-keys \
              "$PPA_GPG_KEY_ID" |
              awk -F: '$1 == "grp" { print $10; exit }'
          )"

          if [[ -z "$keygrip" ]]; then
            echo "::error::无法找到 PPA 签名密钥的 keygrip"
            gpg --batch --with-keygrip --list-secret-keys \
              "$PPA_GPG_KEY_ID"
            exit 1
          fi

          echo "Keygrip found; presetting passphrase."

          gpg-preset-passphrase \
            --preset \
            "$keygrip" \
            <<< "$PPA_GPG_PASSPHRASE"

          # Non-interactive signing.
          debsign \
            --re-sign \
            -k"$PPA_GPG_KEY_ID" \
            "$changes"

      - name: Verify GPG signatures
        if: env.UPLOAD == '1'
        shell: bash
        run: |
          set -euo pipefail
          cd "$BUILD_DIR"
          # Modern dpkg signs inline; fall back to a detached .asc sibling
          # just in case the builder uses the older signature style.
          verify_signed() {
            if gpg --batch --verify "$1" >/dev/null 2>&1; then
              return 0
            fi
            if [[ -f "$1.asc" ]] && gpg --batch --verify "$1.asc" "$1" >/dev/null 2>&1; then
              return 0
            fi
            echo "::error::no valid signature found for $1"
            gpg --batch --verify "$1" || true
            return 1
          }
          for f in \
            "${PKG}_${DEBIAN_VERSION}.dsc" \
            "${PKG}_${DEBIAN_VERSION}_source.buildinfo" \
            "${PKG}_${DEBIAN_VERSION}_source.changes"
          do
            verify_signed "$f"
            echo "verified signature: $f"
          done

      - name: Validate .changes before upload
        if: env.UPLOAD == '1'
        shell: bash
        run: |
          set -euo pipefail
          cd "$BUILD_DIR"
          base="${PKG}_${DEBIAN_VERSION}"
          changes="${base}_source.changes"

          for f in \
            "${base}.dsc" \
            "${PKG}_${UPSTREAM_VERSION}.orig.tar.gz" \
            "${base}.debian.tar.xz" \
            "${base}_source.buildinfo" \
            "$changes"
          do
            [[ -f "$f" ]] || { echo "::error::缺少待上传文件: $f"; exit 1; }
          done

          distro="$(awk -F': ' '/^Distribution:/{print $2; exit}' "$changes")"
          ver="$(awk -F': ' '/^Version:/{print $2; exit}' "$changes")"
          [[ "$distro" == "$DIST" ]] || { echo "::error::distribution 为 '$distro'，期望 $DIST"; exit 1; }
          [[ "$ver" == "$DEBIAN_VERSION" ]] || { echo "::error::changes 版本为 '$ver'，期望 $DEBIAN_VERSION"; exit 1; }

          # Every file referenced by a checksum block must exist locally.
          mapfile -t referenced < <(
            awk '/^(Files|Checksums-Sha1|Checksums-Sha256):/{c=1;next} /^$/{c=0} c{print $NF}' "$changes"
          )
          for f in "${referenced[@]}"; do
            [[ -f "$f" ]] || { echo "::error::.changes 引用了不存在的文件: $f"; exit 1; }
          done

          # Never let a stale dput marker masquerade as this run's upload.
          rm -f ./*.upload

          echo "::group::上传前安全摘要"
          echo "PPA           : $PPA"
          echo "Distribution  : $distro"
          echo "Version       : $ver"
          echo "Files         :"
          sha256sum \
            "${base}.dsc" \
            "${PKG}_${UPSTREAM_VERSION}.orig.tar.gz" \
            "${base}.debian.tar.xz" \
            "${base}_source.buildinfo" \
            "$changes"
          echo "::endgroup::"

      - name: Upload source package to PPA with dput
        if: env.UPLOAD == '1'
        shell: bash
        run: |
          set -euo pipefail
          cd "$BUILD_DIR"
          changes="${PKG}_${DEBIAN_VERSION}_source.changes"
          # No --force and no retry loop: a rejection (e.g. same version
          # already uploaded) must fail the job loudly instead of being
          # papered over. dput is non-interactive and uses the signature in
          # the .changes for Launchpad authorisation.
          if ! dput "$PPA" "$changes"; then
            echo "::error::dput 上传失败。若提示版本已存在，请勿强制覆盖，应改用新版本号。"
            exit 1
          fi
          echo "dput 已接受上传: $changes -> $PPA"
          ls -1 ./*.upload 2>/dev/null || true

      - name: Note dry-run outcome
        if: env.UPLOAD != '1'
        shell: bash
        run: |
          echo "演练模式：已构建源码包并通过 lintian，但未签名/未上传 PPA。"
          echo "手动触发时勾选 confirm_upload 才会真正上传。"

      - name: Upload source package artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ppa-source-${{ env.UPSTREAM_VERSION }}
          if-no-files-found: ignore
          retention-days: 14
          path: |
            ${{ env.BUILD_DIR }}/*.dsc
            ${{ env.BUILD_DIR }}/*.orig.tar.gz
            ${{ env.BUILD_DIR }}/*.debian.tar.xz
            ${{ env.BUILD_DIR }}/*.buildinfo
            ${{ env.BUILD_DIR }}/*.changes
            ${{ env.BUILD_DIR }}/*.build
            ${{ env.BUILD_DIR }}/*.upload
            ${{ env.BUILD_DIR }}/lintian.log
